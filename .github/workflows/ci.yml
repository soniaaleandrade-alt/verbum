name: Verbum Studio CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'sprint-*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        working-directory: frontend/app
        run: npx tsc --noEmit

      - name: Static runtime syntax
        run: |
          node --check frontend/app/src/static-runtime.js
          node --check frontend/app/src/workspace-mobile-runtime.js
          node --check frontend/app/src/identification-runtime.js
          node --check frontend/app/src/project-stage-runtime.js
          node --check frontend/app/src/planning-stage-runtime.js
          node --check frontend/app/src/development-stage-runtime.js
          node --check frontend/app/src/chapter-workflow-runtime.js
          node --check frontend/app/src/chapter-preparation-runtime.js
          node --check frontend/app/src/chapter-research-runtime.js
          node --check frontend/app/src/chapter-writing-runtime.js
          node --check frontend/app/src/chapter-revision-runtime.js
          node --check frontend/app/src/general-review-runtime.js
          node --check frontend/app/src/work-versions-runtime.js
          node --check frontend/app/src/work-audit-runtime.js
          node --check frontend/app/src/editorial-desk-runtime.js
          node --check frontend/app/src/layout-stage-runtime.js
          node --check frontend/app/src/technical-runtime.js
          node --check frontend/app/src/dashboard-official-runtime.js

      - name: PHP tests
        run: composer test

      - name: Frontend static checks
        run: node frontend/app/scripts/test.mjs

      - name: Rebuild static assets
        run: node frontend/app/scripts/build.mjs

      - name: Verify build is committed
        run: git diff --exit-code -- build/verbum-app.js build/verbum-app.css

      - name: PHP syntax
        run: |
          php -l verbum-studio.php
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Diff whitespace check
        run: git diff --check HEAD^
